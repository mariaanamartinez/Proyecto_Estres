<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Login - Mi Proyecto</title>
    <link rel="stylesheet" href="estilos2.css"/>

</head>
<body>
    <div class="tarjetaInicio">
        <div class="contenedorAmarillo">
            <h1>Iniciar Sesión</h1>
            <div class="recuadro-formulario">
                <form id="loginForm">
                    <div class="grupo-formulario">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required >
                        <!-- <div class="error-mensaje" id="errorEmail">Ingresa un correo válido</div>--> 
                    </div>
    
                    <div class="grupo-formulario">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <!--<div class="error-mensaje" id="errorPassword">La contraseña es requerida</div>--> 
                    </div>
    
                    <button onclick="window.location.href='paginaPrincipal.html'" class="boton">
                        Inciar Sesion
                    </button>
                </form>
    
                <div class="opciones">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                    <a href="registro.html">Crear cuenta nueva</a>
                </div>
            </div>
        </div>

    </div>
    
</body>
</html>
