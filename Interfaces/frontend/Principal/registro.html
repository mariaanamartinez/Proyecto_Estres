<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Registro - Mi Proyecto</title>
    <link rel="stylesheet" href="estilos3.css"/>

</head>
<body>
    <div class="tarjetaInicio">
        <div class="contenedorAmarillo">
            <h1>Crear Cuenta</h1>
            <div class="subtitulo">Completa tus datos para registrarte</div>
            
            <div class="recuadro-formulario">
                <div class="exito-mensaje" id="exitoMensaje">
                    ¡Registro exitoso! Redirigiendo...
                </div>
    
                <form id="registroForm">
                    <div class="grupo-formulario">
                        <label for="nombre">Nombre de usuario</label>
                        <input type="text" id="nombre" name="nombre"  required>
                        <div class="error-mensaje" id="errorNombre">Ingresa tu nombre completo</div>
                    </div>
    
                    <div class="grupo-formulario">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                        <div class="error-mensaje" id="errorEmail">Ingresa un correo electrónico válido</div>
                    </div>
    
                    <div class="grupo-formulario">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>
                        <div class="error-mensaje" id="errorPassword">La contraseña debe tener al menos 6 caracteres</div>
                    </div>
    
                    <div class="grupo-formulario">
                        <label for="confirmar_password">Confirmar contraseña</label>
                        <input type="password" id="confirmar_password" name="confirmar_password" required>
                        <div class="error-mensaje" id="errorConfirmar">Las contraseñas no coinciden</div>
                    </div>
    
                    <button onclick="window.location.href='cuestionario1.html'" class="boton">Registrarme</button>

                    
                </form>
    
                <div class="opciones">
                    ¿Ya tienes cuenta? <a href="inicio.html">Inicia sesión aquí</a>
                </div>
            </div>
        </div>
    </div>
    

    
</body>
</html>
